  tittel: Årsmøte i Oslobygda kulturlag
  stad: Kaffistova, kjellaren
  merknad: "24. februar blir det årsmøte i Oslobygda kulturlag. Alle medlemmar som\
    \ har betalt medlemspengar for 2026 har røyste- og forslagsrett. Alle som vil\
    \ vere med får talerett! Det er lov med ein øl til møtet. \r\n\r\nÅrsmøtepapira\
