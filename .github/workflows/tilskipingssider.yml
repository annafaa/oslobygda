name: Lag eigne tilskipingssider
on:
  push:
    branches: [main]
    paths:
      - '_data/kalender.yml'
      - 'skript/bygg_tilskipingssider.rb'
      - '.github/workflows/tilskipingssider.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: tilskipingssider
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Lag sider for nye tilskipingar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git pull --ff-only origin main
            ruby skript/bygg_tilskipingssider.rb
            git add tilskipingar
            if git diff --cached --quiet; then
              break
            fi
            git commit -m 'Lag sider for nye tilskipingar'
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = 4 ]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
          done
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
